<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060916" />
    <meta name="description" content="National Level Sinhgad Hackathon 2K27 at SKN Sinhgad College of Engineering." />
    <title>National Level Sinhgad Hackathon 2K27</title>
    <style>
      #boot-screen { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #060916; color: #f5f7ff; pointer-events: none; opacity: 1; transition: opacity .42s ease; }
      #boot-screen.is-ready { opacity: 0; }
      .boot-wordmark-exit { opacity: 1; transform: translateY(0); transition: opacity .22s ease-out, transform .22s ease-out; }
      #boot-screen.is-ready .boot-wordmark-exit { opacity: 0; transform: translateY(-4px); }
      .boot-brand { font-family: 'Space Grotesk', sans-serif; font-size: clamp(14px, 3vw, 20px); font-weight: 700; letter-spacing: .15em; text-align: center; text-transform: uppercase; opacity: 0; transform: translateY(6px); animation: boot-reveal .35s ease-out forwards; }
      .boot-brand span { color: #9c9aff; }
      @keyframes boot-reveal { to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { #boot-screen, .boot-wordmark-exit { transition: none; } #boot-screen.is-ready .boot-wordmark-exit { transform: none; } .boot-brand { animation: none; opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <div id="boot-screen" aria-hidden="true"><div class="boot-wordmark-exit"><div class="boot-brand">Sinhgad <span>Hackathon</span> 2K27</div></div></div>
    <div id="root"></div>
    <noscript><div style="position:relative;z-index:201;padding:2rem;color:#f5f7ff;background:#060916;font-family:sans-serif">JavaScript is required for this interactive site. <a style="color:#a9d9ff" href="https://events.happenium.com/events/30/register">Open registration</a>.</div></noscript>
    <script>
      window.addEventListener('error', function () {
        var screen = document.getElementById('boot-screen')
        if (!screen || screen.classList.contains('is-ready')) return
        screen.remove()
        document.getElementById('root').innerHTML = '<div style="padding:2rem;color:#f5f7ff;font-family:sans-serif">The interactive site could not load. <a style="color:#a9d9ff" href="https://events.happenium.com/events/30/register">Open registration</a>.</div>'
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
